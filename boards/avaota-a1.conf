# Avaota A1
BOARD_NAME="avaota-a1"
DEVICE_DTS="allwinner/sun55i-t527-avaota-a1"
ARCH="arm64"
KERNEL_BRANCH="bsp"
KERNEL_GCC="aarch64-linux-gnu-"
BOOTARGS="root=LABEL=rootfs earlycon=uart8250,mmio32,0x02500000 clk_ignore_unused initcall_debug=0 console=ttyAS0,115200 loglevel=8 cma=64M init=/sbin/init rw fsck.fix=yes fsck.repair=yes net.ifnames=0"

case "${KERNEL_TARGET}" in

	bsp)
		# Linux 5.15 kernel configure
		LINUX_REPO="https://github.com/AvaotaSBC/linux.git"
		LINUX_GITEE_REPO="https://github.com/AvaotaSBC/linux.git"
		LINUX_BRANCH="linux-5.15"
		LINUX_CONFIG="sun55i_t527_bsp_defconfig"
		LINUX_PATHDIR="none"
		;;

esac

setup_dhcp(){
    # Generate locales in chroot (en_US for CLI production)
    setup_mount_resolv  # Ensure mounts (if not already)
    cat <<EOF | LC_ALL=C chroot ${ROOTFS}
apt update
apt install -y locales
echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
locale-gen en_US.UTF-8
update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
apt clean
EOF

    if [[ "${VERSION}" == "jammy" || "${VERSION}" == "noble" ]];then
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} netplan set ethernets.eth0.dhcp4=true
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} netplan set ethernets.eth0.dhcp6=true
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} netplan set ethernets.eth1.dhcp4=true
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} netplan set ethernets.eth1.dhcp6=true
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} sudo chmod 600 /etc/netplan/*.yaml
    elif [[ "${VERSION}" == "bookworm" || "${VERSION}" == "trixie" || "${VERSION}" == "bullseye" || "${VERSION}" == "focal" ]];then
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} apt-get update
        LC_ALL=en_US.UTF-8 LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 chroot ${ROOTFS} apt-get install ifupdown
    fi
}

# Bootloader
BL_CONFIG="sunxi-syterkit"
SYTERKIT_REPO="https://github.com/YuzukiHD/SyterKit"
SYTERKIT_BRANCH="dev"
SYTERKIT_TYPE="extlinux_boot"
